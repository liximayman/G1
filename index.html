<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống XSMB Pro - 2026</title>
    <style>
        :root {
            --bg-dark: #121212; --card-bg: #1e1e1e;
            --primary: #ff4d4d; --secondary: #2ecc71;
            --text: #e0e0e0; --blue: #3498db;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; padding-bottom: 60px; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        
        /* Tabs */
        .tabs { display: flex; background: #000; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .tab-item { flex: 1; padding: 15px 5px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; color: #888; }
        .tab-item.active { color: var(--primary); border-bottom: 3px solid var(--primary); }

        /* KQ Box */
        .live-box { width: 100%; height: 500px; overflow: hidden; position: relative; background: #fff; border-radius: 8px; margin-top: 10px; }
        .live-box iframe { position: absolute; top: -100px; left: 0; width: 100%; height: 2000px; border: none; }

        /* Ghép Số */
        .grid-num { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; padding: 10px 0; }
        .btn-num { background: #333; border: 1px solid #444; color: white; padding: 12px 0; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-num.active { background: var(--secondary); border-color: #fff; }
        #display-dan { background: #000; padding: 15px; margin: 15px 0; border-radius: 8px; color: #00ff00; word-break: break-all; min-height: 40px; border: 1px dashed #555; font-family: monospace; }

        /* Xiên Ghép */
        .field-group { margin-bottom: 15px; }
        .field-group label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        textarea, select { width: 100%; background: #1e1e1e; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; background: var(--secondary); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; margin-top: 10px; }
        .result-box { background: #000; padding: 15px; border: 1px solid #333; color: #00ff00; margin-top: 10px; border-radius: 5px; max-height: 200px; overflow-y: auto; font-family: monospace; line-height: 1.6; }
        .stats { font-size: 13px; color: var(--blue); margin-top: 8px; font-weight: bold; }
        .btn-copy-xien { width: 100%; padding: 12px; margin-top: 10px; background: var(--blue); border: none; color: white; border-radius: 5px; cursor: pointer; display: none; }

        .panel { display: none; }
        .panel.active { display: block; }
        h4 { margin: 10px 0 5px 0; color: var(--primary); font-size: 14px; text-transform: uppercase; }
    </style>
</head>
<body>
    
    <div class="tabs">
        <div class="tab-item active" onclick="openTab(event, 'kq')">KẾT QUẢ</div>
        <div class="tab-item" onclick="openTab(event, 'ghep')">GHÉP SỐ</div>
        <div class="tab-item" onclick="openTab(event, 'xien')">XIÊN GHÉP</div>
    </div>

    <div class="container">
        <div id="kq" class="panel active">
            <p style="text-align: center; color: var(--secondary); font-size: 12px;">● Dữ liệu trực tuyến 2026</p>
            <div class="live-box">
                <iframe src="https://az24.vn/xsmb-30-ngay.html"></iframe>
            </div>
        </div>

        <div id="ghep" class="panel">
            <h4>ĐẦU (Hàng chục)</h4>
            <div class="grid-num" id="chuc-grid"></div>
            <div class="grid-num" style="grid-template-columns: repeat(3, 1fr);">
                <button class="btn-num" onclick="selectQuick('chuc', 'tai')">Tài</button>
                <button class="btn-num" onclick="selectQuick('chuc', 'xiu')">Xỉu</button>
                <button class="btn-num" onclick="selectQuick('chuc', 'le')">Lẻ</button>
                <button class="btn-num" onclick="selectQuick('chuc', 'chan')">Chẵn</button>
                <button class="btn-num" onclick="selectQuick('chuc', 'tatca')">Hết</button>
                <button class="btn-num" style="background:#600;" onclick="clearSet('chuc')">Xóa</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 15px 0;">

            <h4>ĐUÔI (Hàng đơn vị)</h4>
            <div class="grid-num" id="dv-grid"></div>
            <div class="grid-num" style="grid-template-columns: repeat(3, 1fr);">
                <button class="btn-num" onclick="selectQuick('dv', 'tai')">Tài</button>
                <button class="btn-num" onclick="selectQuick('dv', 'xiu')">Xỉu</button>
                <button class="btn-num" onclick="selectQuick('dv', 'le')">Lẻ</button>
                <button class="btn-num" onclick="selectQuick('dv', 'chan')">Chẵn</button>
                <button class="btn-num" onclick="selectQuick('dv', 'tatca')">Hết</button>
                <button class="btn-num" style="background:#600;" onclick="clearSet('dv')">Xóa</button>
            </div>

            <div id="display-dan">Dàn (0 số): </div>
            <button onclick="copyDan()" style="width: 100%; padding: 15px; background:var(--blue); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer;">SAO CHÉP DÀN</button>
        </div>

        <div id="xien" class="panel">
            <div class="field-group">
                <label>Nhập dãy số (cách nhau bởi dấu phẩy hoặc khoảng cách):</label>
                <textarea id="inputNumbers" rows="3" placeholder="Ví dụ: 01 12 45 67 89"></textarea>
            </div>
            <div class="field-group">
                <label>Số muốn loại bỏ (số khan):</label>
                <textarea id="excludeNumbers" rows="1" placeholder="Ví dụ: 13 49"></textarea>
            </div>
            <div class="field-group">
                <label>Loại xiên:</label>
                <select id="xienType">
                    <option value="2">Ghép Xiên 2</option>
                    <option value="3">Ghép Xiên 3</option>
                    <option value="4">Ghép Xiên 4</option>
                </select>
            </div>
            <button class="btn-main" onclick="processXien()">BẮT ĐẦU GHÉP</button>
            
            <div id="resultContainer" style="display:none;">
                <div id="count" class="stats"></div>
                <div id="output" class="result-box"></div>
                <button id="copyBtnXien" class="btn-copy-xien" onclick="copyXien()">SAO CHÉP KẾT QUẢ</button>
            </div>
        </div>
    </div>

<script>
    let chucSet = new Set(), dvSet = new Set();
    let currentXienResult = "";

    function initButtons() {
        const cGrid = document.getElementById('chuc-grid');
        const dGrid = document.getElementById('dv-grid');
        for(let i=0; i<10; i++) {
            cGrid.innerHTML += `<button class="btn-num" id="c-${i}" onclick="toggleNum('chuc', ${i})">${i}</button>`;
            dGrid.innerHTML += `<button class="btn-num" id="d-${i}" onclick="toggleNum('dv', ${i})">${i}</button>`;
        }
    }

    function openTab(evt, tabName) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
        document.getElementById(tabName).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function toggleNum(type, n) {
        let set = (type === 'chuc') ? chucSet : dvSet;
        let id = (type === 'chuc') ? `c-${n}` : `d-${n}`;
        const btn = document.getElementById(id);
        if(set.has(n)) { set.delete(n); btn.classList.remove('active'); } 
        else { set.add(n); btn.classList.add('active'); }
        renderDan();
    }

    function selectQuick(type, mode) {
        for(let i=0; i<10; i++) {
            let shouldSelect = false;
            if(mode==='tai' && i>=5) shouldSelect = true;
            else if(mode==='xiu' && i<5) shouldSelect = true;
            else if(mode==='le' && i%2!==0) shouldSelect = true;
            else if(mode==='chan' && i%2===0) shouldSelect = true;
            else if(mode==='tatca') shouldSelect = true;

            const set = (type === 'chuc') ? chucSet : dvSet;
            const btn = document.getElementById((type === 'chuc' ? 'c-' : 'd-') + i);
            if(shouldSelect) { set.add(i); btn.classList.add('active'); }
        }
        renderDan();
    }

    function clearSet(type) {
        if(type==='chuc') { chucSet.clear(); document.querySelectorAll('#chuc-grid .btn-num').forEach(b=>b.classList.remove('active')); } 
        else { dvSet.clear(); document.querySelectorAll('#dv-grid .btn-num').forEach(b=>b.classList.remove('active')); }
        renderDan();
    }

    function renderDan() {
        let res = [];
        let chucArr = Array.from(chucSet).sort((a,b) => a-b);
        let dvArr = Array.from(dvSet).sort((a,b) => a-b);
        chucArr.forEach(c => { dvArr.forEach(d => res.push(c + "" + d)); });
        document.getElementById('display-dan').innerText = res.length > 0 ? "Dàn (" + res.length + " số): " + res.join(", ") : "Dàn (0 số): ";
    }

    function copyDan() {
        const text = document.getElementById('display-dan').innerText;
        if(text.includes(": ")) {
            navigator.clipboard.writeText(text.split(": ")[1]).then(() => alert("Đã copy dàn số!"));
        } else { alert("Chưa có số nào để copy!"); }
    }

    function processXien() {
        const input = document.getElementById('inputNumbers').value;
        const exclude = document.getElementById('excludeNumbers').value;
        const size = parseInt(document.getElementById('xienType').value);
        
        let numbers = input.split(/[\s, \n]+/).filter(n => n.length > 0);
        let excludeList = exclude.split(/[\s, \n]+/).filter(n => n.length > 0);
        numbers = [...new Set(numbers)].filter(n => !excludeList.includes(n));

        if (numbers.length < size) { alert(`Cần ít nhất ${size} số để ghép!`); return; }

        let results = [];
        function combine(start, path) {
            if (path.length === size) { results.push(path.join("-")); return; }
            for (let i = start; i < numbers.length; i++) { combine(i + 1, [...path, numbers[i]]); }
        }
        combine(0, []);

        currentXienResult = results.join("\n");
        document.getElementById('resultContainer').style.display = 'block';
        document.getElementById('output').innerText = results.join(", ");
        document.getElementById('count').innerText = `Tổng cộng: ${results.length} cặp xiên ${size}`;
        document.getElementById('copyBtnXien').style.display = 'block';
    }

    function copyXien() {
        if (!currentXienResult) return;
        navigator.clipboard.writeText(currentXienResult).then(() => {
            const btn = document.getElementById('copyBtnXien');
            btn.innerText = "ĐÃ SAO CHÉP!";
            setTimeout(() => btn.innerText = "SAO CHÉP KẾT QUẢ", 2000);
        });
    }

    window.onload = initButtons;
</script>
</body>
</html>
