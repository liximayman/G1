<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống XSMB Pro 2026</title>
    <style>
        :root {
            --bg-dark: #121212; --card-bg: #1e1e1e;
            --primary: #ff4d4d; --secondary: #2ecc71;
            --text: #e0e0e0; --blue: #3498db;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; padding-bottom: 30px; }
        .container { max-width: 500px; margin: auto; padding: 10px; }
        
        /* Tabs Navigation */
        .tabs { display: flex; background: #000; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
        .tab-item { flex: 1; padding: 15px 5px; text-align: center; cursor: pointer; font-size: 13px; font-weight: bold; color: #888; transition: 0.3s; }
        .tab-item.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: #1a1a1a; }

        /* Content Panels */
        .panel { display: none; animation: fadeIn 0.3s; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Iframe Kết quả */
        .live-box { width: 100%; height: 550px; overflow: hidden; position: relative; background: #fff; border-radius: 8px; margin-top: 10px; }
        .live-box iframe { position: absolute; top: -110px; left: 0; width: 100%; height: 2000px; border: none; }

        /* Grid Số */
        h4 { margin: 15px 0 8px 0; color: var(--primary); font-size: 14px; display: flex; justify-content: space-between; }
        .grid-num { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
        .btn-num { background: #2a2a2a; border: 1px solid #444; color: white; padding: 12px 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn-num.active { background: var(--secondary); border-color: #fff; font-weight: bold; }
        
        .quick-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 20px; }
        .btn-quick { background: #333; border: none; color: #bbb; padding: 10px 0; border-radius: 4px; cursor: pointer; font-size: 13px; }

        /* Kết quả & Sao chép */
        .display-area { background: #000; padding: 15px; border-radius: 8px; color: #00ff00; word-break: break-all; min-height: 50px; border: 1px dashed #444; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 10px; white-space: pre-wrap; }
        .btn-copy-main { width: 100%; padding: 16px; background: var(--blue); border: none; color: white; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-copy-main:active { transform: scale(0.98); }

        /* Input cho Xiên */
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 13px; color: #888; }
        textarea, select { width: 100%; background: #1e1e1e; color: #fff; border: 1px solid #444; padding: 12px; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
        textarea:focus { border-color: var(--blue); }
        .stats { font-size: 13px; color: var(--blue); margin-bottom: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="tabs">
        <div class="tab-item active" onclick="openTab(event, 'kq')">KẾT QUẢ</div>
        <div class="tab-item" onclick="openTab(event, 'ghep')">GHÉP SỐ</div>
        <div class="tab-item" onclick="openTab(event, 'xien')">XIÊN GHÉP</div>
    </div>

    <div class="container">
        <div id="kq" class="panel active">
            <div class="live-box">
                <iframe src="https://az24.vn/xsmb-30-ngay.html"></iframe>
            </div>
        </div>

        <div id="ghep" class="panel">
            <h4>ĐẦU (Hàng chục)</h4>
            <div class="grid-num" id="chuc-grid"></div>
            <div class="quick-group">
                <button class="btn-quick" onclick="selectQuick('chuc', 'tai')">Tài (5-9)</button>
                <button class="btn-quick" onclick="selectQuick('chuc', 'xiu')">Xỉu (0-4)</button>
                <button class="btn-quick" onclick="selectQuick('chuc', 'tatca')">Tất cả</button>
                <button class="btn-quick" style="color:#ff4d4d" onclick="clearSet('chuc')">Xóa đầu</button>
            </div>

            <h4>ĐUÔI (Hàng đơn vị)</h4>
            <div class="grid-num" id="dv-grid"></div>
            <div class="quick-group">
                <button class="btn-quick" onclick="selectQuick('dv', 'tai')">Tài (5-9)</button>
                <button class="btn-quick" onclick="selectQuick('dv', 'xiu')">Xỉu (0-4)</button>
                <button class="btn-quick" onclick="selectQuick('dv', 'tatca')">Tất cả</button>
                <button class="btn-quick" style="color:#ff4d4d" onclick="clearSet('dv')">Xóa đuôi</button>
            </div>

            <div id="display-dan" class="display-area">Dàn số sẽ hiện ở đây...</div>
            <button class="btn-copy-main" onclick="copyToClipboard('display-dan', 'Dàn số')">SAO CHÉP DÀN</button>
        </div>

        <div id="xien" class="panel">
            <div class="input-group">
                <label>Nhập dãy số (cách nhau bằng khoảng trắng, phẩy hoặc xuống dòng):</label>
                <textarea id="inputNumbers" rows="4" placeholder="Ví dụ: 01 12 45 67 88 92"></textarea>
            </div>
            <div class="input-group">
                <label>Chọn kiểu xiên:</label>
                <select id="xienType">
                    <option value="2">Ghép Xiên 2</option>
                    <option value="3">Ghép Xiên 3</option>
                    <option value="4">Ghép Xiên 4</option>
                </select>
            </div>
            <button class="btn-copy-main" style="background: var(--secondary); margin-bottom: 20px;" onclick="processXien()">BẮT ĐẦU GHÉP XIÊN</button>

            <div id="resultXienArea" style="display: none;">
                <div id="countXien" class="stats"></div>
                <div id="display-xien" class="display-area"></div>
                <button id="btnCopyXien" class="btn-copy-main" onclick="copyToClipboard('display-xien', 'Kết quả xiên')">SAO CHÉP KẾT QUẢ XIÊN</button>
            </div>
        </div>
    </div>

    <script>
        let chucSet = new Set(), dvSet = new Set();

        // Khởi tạo phím số
        function init() {
            const cg = document.getElementById('chuc-grid');
            const dg = document.getElementById('dv-grid');
            for(let i=0; i<10; i++) {
                cg.innerHTML += `<button class="btn-num" id="c-${i}" onclick="toggleNum('chuc', ${i})">${i}</button>`;
                dg.innerHTML += `<button class="btn-num" id="d-${i}" onclick="toggleNum('dv', ${i})">${i}</button>`;
            }
        }

        function openTab(evt, name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function toggleNum(type, n) {
            let set = (type === 'chuc') ? chucSet : dvSet;
            let id = (type === 'chuc' ? 'c-' : 'd-') + n;
            if(set.has(n)) {
                set.delete(n);
                document.getElementById(id).classList.remove('active');
            } else {
                set.add(n);
                document.getElementById(id).classList.add('active');
            }
            updateDan();
        }

        function selectQuick(type, mode) {
            for(let i=0; i<10; i++) {
                let hit = false;
                if(mode==='tai' && i>=5) hit = true;
                if(mode==='xiu' && i<5) hit = true;
                if(mode==='tatca') hit = true;
                if(hit) {
                    (type==='chuc' ? chucSet : dvSet).add(i);
                    document.getElementById((type==='chuc'?'c-':'d-')+i).classList.add('active');
                }
            }
            updateDan();
        }

        function clearSet(type) {
            if(type==='chuc') {
                chucSet.clear();
                document.querySelectorAll('#chuc-grid .btn-num').forEach(b => b.classList.remove('active'));
            } else {
                dvSet.clear();
                document.querySelectorAll('#dv-grid .btn-num').forEach(b => b.classList.remove('active'));
            }
            updateDan();
        }

        function updateDan() {
            let res = [];
            let cArr = Array.from(chucSet).sort();
            let dArr = Array.from(dvSet).sort();
            cArr.forEach(c => dArr.forEach(d => res.push(c + "" + d)));
            const area = document.getElementById('display-dan');
            area.innerText = res.length > 0 ? res.join(", ") : "Dàn số sẽ hiện ở đây...";
        }

        // XỬ LÝ XIÊN
        let rawXienOutput = ""; // Biến lưu để copy dạng xuống dòng

        function processXien() {
            const txt = document.getElementById('inputNumbers').value;
            const size = parseInt(document.getElementById('xienType').value);
            // Lọc số chuẩn
            let nums = txt.split(/[\s, \n, \t]+/).filter(n => n.length > 0);
            nums = [...new Set(nums)]; // Xóa trùng

            if(nums.length < size) {
                alert("Bạn cần nhập ít nhất " + size + " số khác nhau.");
                return;
            }

            let result = [];
            function combine(start, current) {
                if(current.length === size) {
                    result.push(current.join("-"));
                    return;
                }
                for(let i = start; i < nums.length; i++) {
                    combine(i + 1, [...current, nums[i]]);
                }
            }
            combine(0, []);

            rawXienOutput = result.join("\n"); // Dùng để copy xuống dòng
            document.getElementById('resultXienArea').style.display = 'block';
            document.getElementById('countXien').innerText = "Tạo thành công: " + result.length + " cặp xiên " + size;
            document.getElementById('display-xien').innerText = result.join(", ");
        }

        // HÀM SAO CHÉP DÙNG CHUNG
        function copyToClipboard(elementId, label) {
            let text = "";
            if(elementId === 'display-xien') {
                text = rawXienOutput; // Ưu tiên copy xiên dạng xuống dòng
            } else {
                text = document.getElementById(elementId).innerText;
            }

            if(!text || text.includes("hiện ở đây")) {
                alert("Chưa có dữ liệu để sao chép!");
                return;
            }

            navigator.clipboard.writeText(text).then(() => {
                const btn = event.currentTarget;
                const originalText = btn.innerText;
                btn.innerText = "✓ ĐÃ SAO CHÉP " + label.toUpperCase();
                btn.style.background = "#2ecc71";
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.background = (elementId === 'display-dan') ? "var(--blue)" : "var(--blue)";
                }, 2000);
            }).catch(err => {
                alert("Lỗi sao chép: " + err);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
